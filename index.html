<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>eNook</title>
<meta name="theme-color" content="#6366f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="eNook">
<link rel="manifest" href="./manifest.json?v=202608201844">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png?v=202608201844">
<link rel="apple-touch-icon" sizes="192x192" href="./icons/icon-192.png?v=202608201844">
<link rel="apple-touch-icon" sizes="512x512" href="./icons/icon-512.png?v=202608201844">
<link rel="icon" href="./icons/favicon.png?v=202608201844" type="image/png">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<header id="topbar">
  <button id="btn-settings" class="icon-btn" title="设置"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
  <div class="title-wrap" id="title-wrap">
    <button class="title-btn" id="title-btn">
      <span id="title">资产</span>
      <span class="arrow"></span>
    </button>
    <div class="title-dropdown" id="title-dropdown">
      <div class="dd-item active" data-view="asset">
        <span class="dd-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="18" rx="2"/><line x1="2" y1="9" x2="22" y2="9"/></svg></span>
        <span>资产</span>
      </div>
      <div class="dd-divider"></div>
      <div class="dd-item" data-view="trade">
        <span class="dd-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></span>
        <span>买卖记账</span>
      </div>
      <div class="dd-divider"></div>
      <div class="dd-item" data-view="health">
        <span class="dd-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></span>
        <span>健康运动</span>
      </div>
      <div class="dd-divider"></div>
      <div class="dd-item" data-view="notes">
        <span class="dd-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg></span>
        <span>小记</span>
      </div>
    </div>
  </div>
  <div class="topbar-right">
    <button id="btn-eye" class="icon-btn" title="隐藏金额"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
  </div>
</header>
<div id="dd-overlay"></div>
<div id="sync-bar" class="sync-bar hidden"></div>
<div id="ptr-indicator" class="ptr-indicator"><span class="ptr-spinner"></span><span class="ptr-text">下拉刷新</span></div>
<main>
  <section id="view-assets" class="view"></section>
  <section id="view-trend" class="view hidden"></section>
  <section id="view-trade" class="view hidden">
    <div id="trade-ledger">
      <div class="summary-grid" id="trade-summary"></div>
      <div class="trade-filter-bar">
        <div class="trade-filter-toggle" id="trade-filter-toggle"><span>筛选条件</span><span class="ft-arrow">▼</span></div>
        <div class="trade-filter-body" id="trade-filter-body">
          <div class="trade-filter-row" style="margin-top:8px"><input type="text" id="f-trade-name" placeholder="搜索商品名"></div>
          <div class="trade-filter-row"><input type="text" id="f-trade-buyer" placeholder="搜索买家"><input type="text" id="f-trade-order" placeholder="订单号"></div>
          <div class="trade-filter-row">
            <select id="f-trade-shipped"><option value="">发货状态</option><option value="yes">已发货</option><option value="no">未发货</option></select>
            <select id="f-trade-paid"><option value="">回款状态</option><option value="yes">已回款</option><option value="no">未回款</option></select>
          </div>
          <div class="trade-filter-row">
            <select id="f-trade-platform"><option value="">全部平台</option></select>
          </div>
          <div class="trade-filter-row"><input type="date" id="f-trade-from" title="开始日期"><input type="date" id="f-trade-to" title="结束日期"></div>
          <div style="text-align:right;margin-top:4px"><span style="font-size:12px;color:var(--accent);cursor:pointer" id="f-trade-reset">重置筛选</span></div>
        </div>
      </div>
      <div class="trade-list" id="trade-list"></div>
      <div class="trade-count" id="trade-count"></div>
    </div>
    <div id="trade-bills" class="hidden">
      <div class="card" style="padding:0;overflow:hidden"><div style="padding:12px 16px;border-bottom:1px solid var(--line);font-weight:600;font-size:14px">营销账单</div><div id="trade-bills-marketing"></div></div>
      <div class="card" style="padding:0;overflow:hidden;margin-top:12px"><div style="padding:12px 16px;border-bottom:1px solid var(--line);font-weight:600;font-size:14px">大壮还款账单</div><div id="trade-bills-repay"></div></div>
    </div>
    <div id="trade-analytics" class="hidden">
      <div class="trade-chart-box">
        <div class="chart-controls" id="trade-chart-period">
          <button class="chart-btn active" data-days="7">近7天</button>
          <button class="chart-btn" data-days="14">近14天</button>
          <button class="chart-btn" data-days="30">近30天</button>
          <button class="chart-btn" data-days="0">全部</button>
        </div>
        <div class="chart-controls" id="trade-chart-metrics">
          <button class="chart-btn" data-metric="count">下单次数</button>
          <button class="chart-btn" data-metric="cost">下单成本</button>
          <button class="chart-btn" data-metric="revenue">出价</button>
          <button class="chart-btn" data-metric="spread">差价</button>
          <button class="chart-btn" data-metric="cps">返现</button>
          <button class="chart-btn active" data-metric="profit">总利润</button>
        </div>
        <div class="chart-canvas-wrap"><canvas id="trade-chart-canvas"></canvas></div>
      </div>
    </div>
  </section>
  <section id="view-health" class="view hidden"></section>
  <section id="view-notes" class="view hidden"></section>
  <section id="view-settings" class="view hidden"></section>
</main>
<nav id="tabbar">
  <button data-tab="assets" class="tab active">资产</button>
  <button id="btn-add" class="fab" title="添加账户">＋</button>
  <button data-tab="trend" class="tab">趋势</button>
</nav>
<div id="modal-root"></div>
<button id="fab-trade" class="fab-trade hidden" title="新增交易">＋</button>
<button id="fab-health" class="fab-health hidden" title="添加记录">＋</button>
<button id="fab-notes" class="fab-notes hidden" title="新建笔记">＋</button>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script src="./core.js"></script>
<script src="./gist.js"></script>
<script src="./trades.js"></script>
<script src="./health.js"></script>
<script src="./notes.js"></script>
<script src="./ui.js"></script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' })
    .then(function(reg) { reg.update(); });
}
</script>
</body>
</html>
